name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static game
        run: |
          mkdir _site
          cp index.html game.js _site/
          cp -r images _site/
          if [ -d "vendor" ]; then cp -r vendor _site/; fi
          if [ -f "three_engine.js" ]; then cp three_engine.js _site/; fi
      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
